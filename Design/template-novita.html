<!DOCTYPE html>
<!--
  Prisma · template navigabile delle 11 novità (3 novembre 2026)
  Parte da Design/template-apple.html (tema Apple) e aggiunge: Studio, Messaggi, Mercato, Prisma ovunque,
  copilota dell'incontro, Inquadra e capisci, prova del fuoco, linea della vita, track record,
  famiglie come la sua, allenamento OCF. Il pulsante «✦ Novità» nella barra porta a ognuna.
  File autonomo, icone incluse. Dati e cifre dimostrativi.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prisma · Template navigabile · le 11 novità</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;--fontd:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;
 --spring:cubic-bezier(.34,1.45,.64,1);--out:cubic-bezier(.22,1,.36,1);
 --accent:#007AFF;--red:#E5484D;--orange:#E08A00;--green:#2FA35A;--r1:#30B15C;--r2:#0A84FF;--r3:#8B5CF6}
body{--ink:rgba(0,0,0,.87);--ink2:rgba(0,0,0,.55);--ink3:rgba(0,0,0,.34);--sep:rgba(0,0,0,.08);--win:rgba(246,248,251,.86);--panel:rgba(255,255,255,.72);--card:rgba(255,255,255,.82);--cardE:#fff;--track:rgba(0,0,0,.07);--chip:rgba(0,0,0,.05);
 --shadow:0 24px 48px -28px rgba(8,40,60,.4),0 2px 8px -3px rgba(8,40,60,.1);--glass:rgba(255,255,255,.5);--glassE:rgba(255,255,255,.7);--wallInk:rgba(8,26,38,.88);--wallInk2:rgba(8,26,38,.6);--scrim:rgba(220,232,240,.4);--chA:#2563EB;--chI:#B06E12;--paper:#fff}
body.dark{--ink:rgba(255,255,255,.94);--ink2:rgba(255,255,255,.62);--ink3:rgba(255,255,255,.38);--sep:rgba(255,255,255,.09);--win:rgba(16,26,35,.86);--panel:rgba(255,255,255,.05);--card:rgba(255,255,255,.07);--cardE:rgba(40,54,66,1);--track:rgba(255,255,255,.1);--chip:rgba(255,255,255,.08);
 --shadow:0 26px 52px -26px rgba(0,0,0,.8),0 3px 10px -3px rgba(0,0,0,.35);--glass:rgba(16,32,44,.42);--glassE:rgba(255,255,255,.16);--wallInk:#fff;--wallInk2:rgba(255,255,255,.66);--scrim:rgba(5,12,18,.5);--chA:#6B95FF;--chI:#D0954A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;background:#BFD4DF}
body.dark{background:#081219}
button,input{font-family:inherit;color:inherit}
#stage{position:absolute;left:50%;top:50%;width:1440px;height:900px;overflow:hidden;border-radius:14px}
#wall{position:absolute;inset:0;width:1440px;height:900px}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--glassE);box-shadow:0 22px 44px -24px rgba(8,40,60,.36),0 3px 10px -4px rgba(8,40,60,.12),inset 0 1px 0 rgba(255,255,255,.55)}
body.dark .glass{box-shadow:0 26px 52px -24px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.12)}
.row{display:flex;align-items:center;gap:8px}
.lbl{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink2);font-weight:600}
.k{font-size:12.5px;color:var(--ink2)}
.v{font-family:var(--fontd);font-size:26px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.h2{font-family:var(--fontd);font-size:21px;font-weight:700;letter-spacing:-.4px}
.btn{white-space:nowrap;border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:600;background:var(--cardE);border:1px solid var(--sep);cursor:pointer;transition:transform .25s var(--spring),filter .2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(.97)}.btn:active{transform:scale(.95)}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
.btn.big{padding:10px 18px;font-size:13.5px}
.chA,.chI{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chA{background:rgba(37,99,235,.13);color:var(--chA)}.chI{background:rgba(176,110,18,.14);color:var(--chI)}
.chA:before,.chI:before{content:"";width:6px;height:6px;border-radius:9px;background:currentColor}
.av{border-radius:99px;display:grid;place-items:center;color:#fff;font-weight:600;flex:none}
.seg{display:inline-flex;background:var(--chip);border-radius:99px;padding:3px;position:relative}
.seg span{position:relative;z-index:1;font-size:13px;padding:6px 14px;border-radius:99px;color:var(--ink2);font-weight:600;cursor:pointer;transition:color .3s;white-space:nowrap}
.seg span.on{color:var(--ink)}
.seg>i{position:absolute;top:3px;bottom:3px;border-radius:99px;background:var(--cardE);box-shadow:0 1px 4px rgba(0,0,0,.14);transition:left .5s var(--spring),width .5s var(--spring)}
.card{border-radius:22px;background:var(--card);border:1px solid var(--sep);box-shadow:var(--shadow);position:relative}
.tilt{transform-style:preserve-3d;transition:transform .5s var(--spring),box-shadow .4s;will-change:transform;cursor:pointer}
.tilt .sheen{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px 200px at var(--mx,50%) var(--my,30%),rgba(255,255,255,.6),transparent 60%);mix-blend-mode:soft-light}
body.dark .tilt .sheen{background:radial-gradient(260px 200px at var(--mx,50%) var(--my,30%),rgba(255,255,255,.16),transparent 60%);mix-blend-mode:normal}
.tilt:hover .sheen{opacity:1}
.tilt:hover{box-shadow:0 40px 60px -30px rgba(8,40,60,.5),0 4px 12px -4px rgba(8,40,60,.16)}
/* barra */
#bar{position:absolute;top:0;left:0;right:0;height:34px;display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:600;color:var(--wallInk);z-index:50;transition:opacity .6s}
#bar .pill{padding:5px 11px;border-radius:99px;display:flex;align-items:center;gap:7px;margin-right:6px;cursor:pointer}
#bar .clock{position:absolute;left:50%;transform:translateX(-50%);font-weight:500;font-variant-numeric:tabular-nums}
#bar .right{margin-left:auto;display:flex;gap:6px;align-items:center}
#bar .ic{width:28px;height:28px;border-radius:99px;display:grid;place-items:center;cursor:pointer;position:relative}
.badge{position:absolute;top:-3px;right:-4px;background:#FF3B30;color:#fff;font-size:9px;border-radius:99px;padding:1px 4px;font-weight:700}
.sfera{border-radius:99px;background:radial-gradient(circle at 34% 28%,#fff 0,#d6ecf9 18%,#7fb9e6 48%,#3f79c0 78%,#2c4f9a 100%);box-shadow:inset 0 -4px 10px rgba(10,30,80,.35),0 4px 12px -4px rgba(40,90,170,.6);position:relative;overflow:hidden}
.sfera:after{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.45),transparent 30%,rgba(160,120,255,.35),transparent 60%,rgba(120,230,255,.4),transparent);animation:gira 6s linear infinite;mix-blend-mode:overlay}
.sfera.viva{animation:respira 4s ease-in-out infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes respira{50%{transform:scale(1.045);box-shadow:inset 0 -4px 10px rgba(10,30,80,.35),0 10px 30px -6px rgba(90,140,255,.7)}}
/* dock */
#dock{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);padding:8px 10px 5px;border-radius:26px;display:flex;align-items:flex-end;gap:4px;z-index:50;transition:transform .7s var(--spring),opacity .5s}
#dock .it{width:62px;text-align:center;font-size:10.5px;color:var(--wallInk);font-weight:500;cursor:pointer;position:relative;transition:width .14s}
#dock img{width:50px;height:50px;display:block;margin:0 auto 2px;transition:width .14s,height .14s;-webkit-user-drag:none;user-select:none}
#dock .dot{width:4px;height:4px;border-radius:9px;background:var(--wallInk);margin:1px auto 0;opacity:0;transition:opacity .3s}
#dock .it.on .dot{opacity:1}
#dock .agd{position:absolute;left:0;right:0;pointer-events:none;text-align:center;color:#222;font-family:var(--fontd)}
/* scrivania */
#desk{position:absolute;inset:0;z-index:5;transition:opacity .5s,filter .5s}
#desk .w{position:absolute;border-radius:26px;padding:18px 20px;cursor:pointer;transition:transform .45s var(--spring)}
#desk .w:hover{transform:translateY(-3px)}
.hello{position:absolute;left:44px;top:48px;color:var(--wallInk)}
.hello b{font-family:var(--fontd);font-size:38px;font-weight:700;letter-spacing:-1.2px;display:block}
.hello span{font-size:15px;color:var(--wallInk2)}
/* finestra */
#win{position:absolute;left:16px;top:42px;width:1408px;height:758px;border-radius:24px;background:var(--win);backdrop-filter:blur(34px) saturate(1.3);-webkit-backdrop-filter:blur(34px) saturate(1.3);border:1px solid var(--glassE);box-shadow:0 40px 80px -24px rgba(8,40,60,.45);overflow:hidden;z-index:20;display:none;transform-origin:0 0}
#win .tb{height:38px;display:flex;align-items:center;padding:0 18px;gap:8px;font-weight:600;font-size:14px}
.lights{display:flex;gap:8px;margin-right:12px}.lights i{width:12px;height:12px;border-radius:9px;display:block;cursor:pointer;position:relative}
.lights:hover i:first-child:after{content:"×";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-style:normal;color:rgba(80,0,0,.7);line-height:12px}
#win .tb img{width:20px;height:20px}
#win .hd{display:flex;align-items:center;padding:4px 18px 12px;gap:10px;height:54px}
#win .hd h1{font-family:var(--fontd);font-size:17px;font-weight:700}
.sub{font-size:12px;letter-spacing:.6px;color:var(--ink2);font-weight:500;text-transform:uppercase}
#wAct{margin-left:auto;display:flex;gap:6px;align-items:center}
#wc{position:absolute;left:12px;right:12px;top:92px;bottom:12px}
#scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .45s,backdrop-filter .45s;z-index:30;backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0)}
#scrim.on{opacity:1;pointer-events:auto;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#det{position:absolute;z-index:31;border-radius:22px;background:var(--cardE);border:1px solid var(--sep);box-shadow:0 50px 90px -30px rgba(8,40,60,.55);overflow:hidden;display:none}
#detC{position:absolute;left:0;top:0;padding:26px 30px;opacity:0;transition:opacity .2s}
#det.aperto #detC{opacity:1;transition:opacity .35s .16s}
/* blocco */
#lock{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;color:var(--wallInk);cursor:pointer;background:rgba(220,234,242,.18);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
body.dark #lock{background:rgba(5,14,20,.25)}
#lock .t{font-family:var(--fontd);font-size:128px;font-weight:300;letter-spacing:-5px;margin-top:150px;font-variant-numeric:tabular-nums;line-height:1}
#lock .d{font-size:22px;font-weight:500;margin-top:10px;opacity:.8}
#lock .go{position:absolute;bottom:70px;padding:12px 22px;border-radius:99px;font-size:14px;font-weight:600;overflow:hidden}
#lock .go:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.7),transparent 70%);transform:translateX(-100%);animation:luce 2.6s ease-in-out infinite}
@keyframes luce{60%,100%{transform:translateX(100%)}}
#toast{position:absolute;left:50%;top:44px;transform:translateX(-50%) translateY(-20px);opacity:0;transition:all .45s var(--spring);background:rgba(15,36,51,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:99px;z-index:95;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#notif{position:absolute;right:12px;top:40px;width:360px;border-radius:22px;padding:14px;z-index:60;display:none}
#notif .n{display:flex;gap:10px;padding:10px;border-radius:14px;background:var(--card);margin-top:8px;font-size:13px;line-height:1.4}
/* liste e pannelli comuni */
.side{position:absolute;left:0;top:0;bottom:0;border-radius:20px;background:var(--panel);border:1px solid var(--sep);padding:14px 12px;overflow:hidden}
.main{position:absolute;top:0;bottom:0;right:0;overflow:hidden}
.rub{display:flex;gap:10px;align-items:center;padding:9px 8px;border-radius:14px;margin-bottom:2px;cursor:pointer;transition:background .25s}
.rub:hover{background:var(--chip)}
.rub.on{background:rgba(0,122,255,.13)}
.rub b{font-size:14px;display:block}.rub small{font-size:12px;color:var(--ink2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.search{width:100%;border:0;outline:0;background:var(--chip);border-radius:99px;padding:8px 14px;font-size:13px;margin:8px 0 10px}
.tile{border-radius:18px;background:var(--card);border:1px solid var(--sep);padding:14px 16px}
.bar8{height:8px;border-radius:9px;background:var(--track);overflow:hidden}
.bar8 i{display:block;height:100%;border-radius:9px;width:0;transition:width 1.2s var(--out)}
.prep{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--sep)}
.prep .dot{width:20px;height:20px;border-radius:99px;border:2px solid var(--track);display:grid;place-items:center;transition:all .35s var(--spring);flex:none}
.prep.ok .dot{background:var(--green);border-color:var(--green);transform:scale(1.08)}
.prep.ok .dot:after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:9px;background:var(--track);outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:99px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.28);cursor:grab}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:99px;background:#fff;border:0;box-shadow:0 3px 10px rgba(0,0,0,.28)}
.sw{width:44px;height:26px;border-radius:99px;background:var(--track);position:relative;cursor:pointer;transition:background .3s;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:99px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:left .35s var(--spring)}
.sw.on{background:#34C759}.sw.on:after{left:21px}
/* posizioni */
.bignum{font-family:var(--fontd);font-size:62px;font-weight:700;letter-spacing:-2.2px;font-variant-numeric:tabular-nums;line-height:1}
.task{width:232px;height:270px;flex:none;position:relative;border-radius:22px;background:var(--card);border:1px solid var(--sep);box-shadow:var(--shadow);transition:transform .5s var(--spring),box-shadow .4s,width .55s var(--spring),margin .55s var(--spring),opacity .4s}
.task .in{position:absolute;inset:0;padding:16px;border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.task .barT{position:absolute;left:0;right:0;top:0;height:4px}
.task .when{font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.task .why{font-family:var(--fontd);font-size:19px;font-weight:700;letter-spacing:-.3px;line-height:1.22;margin:12px 0 auto}
.task .who{display:flex;align-items:center;gap:9px;margin-top:12px}
.task .who b{font-size:13.5px;display:block}.task .who small{font-size:12px;color:var(--ink2)}
.task.via{width:0!important;margin-left:-14px;opacity:0;transform:scale(.85)!important}
.check{position:absolute;inset:0;display:grid;place-items:center;border-radius:22px;pointer-events:none;transition:background .4s}
.check svg{opacity:0}
.task.ok .check{background:rgba(47,163,90,.16)}.task.ok .check svg{opacity:1}
.task.ok .check circle{animation:dr .5s var(--out) forwards}.task.ok .check path{animation:dr .35s .35s var(--out) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.grp{width:112px;flex:none;padding-top:8px;transition:width .5s var(--spring),opacity .4s,margin .5s}
.grp b{font-family:var(--fontd);font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.1;display:block}
.grp span{font-size:12.5px;color:var(--ink2)}
.arr{width:32px;height:32px;border-radius:99px;display:grid;place-items:center;background:var(--cardE);border:1px solid var(--sep);cursor:pointer;font-size:15px}
.leg{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--sep)}
.leg:last-of-type{border-bottom:0}
.leg i{width:10px;height:10px;border-radius:9px;flex:none}
.leg .n{margin-left:auto;font-family:var(--fontd);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.leg .n small{font-size:13px;color:var(--ink2);font-weight:500}
.pulse{filter:drop-shadow(0 0 10px currentColor)}
/* agenda */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.cal .h{font-size:11px;color:var(--ink3);font-weight:600;padding-bottom:4px}
.cal .g{height:36px;border-radius:12px;display:grid;place-items:center;position:relative;cursor:pointer;font-variant-numeric:tabular-nums;transition:background .25s}
.cal .g:hover{background:var(--chip)}
.cal .g.oggi{background:var(--red);color:#fff;font-weight:700}
.cal .g.sel:not(.oggi){background:rgba(0,122,255,.14);font-weight:700}
.cal .g.fuori{color:var(--ink3)}
.cal .g .p{position:absolute;bottom:4px;width:4px;height:4px;border-radius:9px;background:var(--accent)}
.cal .g.oggi .p{background:#fff}
.ev{position:absolute;left:72px;right:16px;border-radius:14px;padding:8px 12px;cursor:pointer;overflow:hidden;border-left:4px solid}
.ev b{font-size:13.5px;display:block}.ev small{font-size:12px;color:var(--ink2)}
/* ruby */
.msg{max-width:640px;margin-bottom:14px;font-size:14.5px;line-height:1.55}
.msg.me{margin-left:auto;background:var(--accent);color:#fff;padding:10px 16px;border-radius:20px 20px 6px 20px;width:fit-content}
.msg.ruby{background:var(--chip);padding:14px 18px;border-radius:20px 20px 20px 6px}
.msg.ruby .who{font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:4px}
.typing{display:inline-flex;gap:4px;padding:4px 0}.typing i{width:7px;height:7px;border-radius:9px;background:var(--ink3);animation:tp 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{30%{transform:translateY(-5px);opacity:1}0%,60%,100%{opacity:.4}}
.sugg{border-radius:99px;padding:8px 14px;font-size:13px;font-weight:500;background:var(--card);border:1px solid var(--sep);cursor:pointer;white-space:nowrap;transition:transform .25s var(--spring)}
.sugg:hover{transform:translateY(-2px)}
/* carta */
.paper{width:600px;height:848px;background:#fff;color:#14202B;box-shadow:0 20px 50px -10px rgba(0,0,0,.25);padding:40px 46px;position:relative;font-family:Inter,var(--font);transform-origin:top center}
.paper .pl{font-size:11px;letter-spacing:1.4px;color:#2563EB;font-weight:700}
.paper h3{font-family:var(--fontd);font-size:36px;font-weight:700;letter-spacing:-1px;line-height:1.05;margin-top:6px}
.paper .ps{font-size:13px;color:#4A5964;margin-top:8px;line-height:1.5}
.paper .kp{border:1px solid #E3E8EC;border-radius:10px;padding:10px 12px}
.paper .kp small{font-size:10.5px;color:#5A6873;display:block}.paper .kp b{font-size:19px}
.paper .sec{font-size:11.5px;font-weight:700;margin-top:22px;letter-spacing:.4px}
.paper .tx{font-size:12.5px;line-height:1.55;color:#33424D;margin-top:6px}
.paper .foot{position:absolute;left:46px;right:46px;bottom:26px;font-size:9px;color:#7A8790;line-height:1.4;border-top:1px solid #E3E8EC;padding-top:8px}

#novP{position:absolute;left:calc(50% - 270px);top:40px;width:540px;border-radius:24px;padding:16px;z-index:62;display:none;max-height:820px;overflow:auto}
.novI{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;cursor:pointer;color:var(--ink);transition:background .2s}
.novI:hover{background:var(--chip)}.novI b{font-size:14px}
.novN{width:26px;height:26px;border-radius:99px;background:linear-gradient(135deg,#5AC8FA,#8B5CF6);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;background:var(--cardE);border:1px solid var(--sep);font-size:13px;font-weight:600;cursor:pointer;transition:all .35s var(--spring)}
.chip:hover{transform:translateY(-2px)}.chip.on{background:var(--red);color:#fff;border-color:transparent}
