<!DOCTYPE html>
<!--
  Ruby · template navigabile delle 25 novità (5 novembre 2026)
  Ruby è il nuovo nome dell'assistente di Prisma (prima Eve). Questo file mostra solo Ruby: il resto di Prisma resta
  com'è nel template «Luce» (stessa scrivania d'acqua, stessa barra, stesso dock, stessi clienti di prova).
  Cinque gruppi: Ruby che fa le cose (1-5), che conosce i tuoi clienti (6-9), che legge e controlla (10-14),
  che scrive come te (15-17), più intelligente (18-25). Ogni novità ha una scena con dati di prova e animazioni;
  «Rivedi» la fa ripartire, le frecce ‹ › (o i tasti ← →) passano alla successiva, «✦ Novità» apre l'indice.
  Dati, documenti, polizze e KID sono fac-simile scritti apposta. Gli articoli di legge citati sono riferimenti reali,
  ma i testi completi andranno caricati nella Biblioteca delle norme. Numeri di simulazioni ed esami sono di esempio.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruby · le 25 novità</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Finestra Ruby 1408×758 sulla scrivania d'acqua di Prisma: barra in alto, dock in basso, indice delle novità a sinistra, scena a destra. */
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;--fontd:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;
 --spring:cubic-bezier(.34,1.45,.64,1);--out:cubic-bezier(.22,1,.36,1);
 --accent:#007AFF;--ruby:#C2264B;--rubyL:#F2577D;--red:#E5484D;--orange:#E08A00;--green:#2FA35A;--violet:#8B5CF6;
 --ink:rgba(0,0,0,.87);--ink2:rgba(0,0,0,.55);--ink3:rgba(0,0,0,.34);--sep:rgba(0,0,0,.08);--win:rgba(246,248,251,.88);--panel:rgba(255,255,255,.72);--card:rgba(255,255,255,.82);--cardE:#fff;--track:rgba(0,0,0,.07);--chip:rgba(0,0,0,.05);
 --shadow:0 24px 48px -28px rgba(8,40,60,.4),0 2px 8px -3px rgba(8,40,60,.1);--glass:rgba(255,255,255,.5);--glassE:rgba(255,255,255,.7);--wallInk:rgba(8,26,38,.88);--wallInk2:rgba(8,26,38,.6);--chA:#2563EB;--chI:#B06E12;--page:#BFD4DF;--hl:rgba(255,214,10,.5)}
body.dark{--ink:rgba(255,255,255,.94);--ink2:rgba(255,255,255,.62);--ink3:rgba(255,255,255,.38);--sep:rgba(255,255,255,.09);--win:rgba(16,26,35,.88);--panel:rgba(255,255,255,.05);--card:rgba(255,255,255,.07);--cardE:rgba(40,54,66,1);--track:rgba(255,255,255,.1);--chip:rgba(255,255,255,.08);
 --shadow:0 26px 52px -26px rgba(0,0,0,.8),0 3px 10px -3px rgba(0,0,0,.35);--glass:rgba(16,32,44,.42);--glassE:rgba(255,255,255,.16);--wallInk:#fff;--wallInk2:rgba(255,255,255,.66);--chA:#6B95FF;--chI:#D0954A;--page:#081219;--ruby:#FF5C83;--hl:rgba(255,214,10,.35);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;background:var(--page)}
button,input,textarea{font-family:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;font-size:inherit;line-height:inherit}
.tile.sel{box-shadow:0 0 0 2px var(--ruby)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
#stage{position:absolute;left:50%;top:50%;width:1440px;height:900px;overflow:hidden;border-radius:14px}
#wall{position:absolute;inset:0;width:1440px;height:900px}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--glassE);box-shadow:0 22px 44px -24px rgba(8,40,60,.36),0 3px 10px -4px rgba(8,40,60,.12),inset 0 1px 0 rgba(255,255,255,.55)}
body.dark .glass{box-shadow:0 26px 52px -24px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.12)}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink2);font-weight:600}
.k{font-size:12.5px;color:var(--ink2);line-height:1.45}
.h2{font-family:var(--fontd);font-size:20px;font-weight:700;letter-spacing:-.4px;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.btn{white-space:nowrap;border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:600;background:var(--cardE);border:1px solid var(--sep);cursor:pointer;transition:transform .25s var(--spring),filter .2s,background .3s,color .3s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(.97)}.btn:active{transform:scale(.95)}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
.btn.rb{background:var(--ruby);color:#fff;border-color:transparent}
.btn.ok{background:var(--green);color:#fff;border-color:transparent}
.btn:disabled{cursor:default}
.chA,.chI{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chA{background:rgba(37,99,235,.13);color:var(--chA)}.chI{background:rgba(176,110,18,.14);color:var(--chI)}
.chA:before,.chI:before{content:"";width:6px;height:6px;border-radius:9px;background:currentColor}
.av{border-radius:99px;display:inline-grid;place-items:center;color:#fff;font-weight:600;flex:none}
.ico{display:block;flex:none;-webkit-user-drag:none;user-select:none}
.card{border-radius:20px;background:var(--card);border:1px solid var(--sep);box-shadow:var(--shadow);position:relative}
.tile{border-radius:16px;background:var(--cardE);border:1px solid var(--sep);padding:12px 14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--chip);white-space:nowrap}
.pill.r{background:rgba(229,72,77,.13);color:var(--red)}.pill.o{background:rgba(224,138,0,.14);color:var(--orange)}.pill.g{background:rgba(47,163,90,.14);color:var(--green)}.pill.b{background:rgba(0,122,255,.12);color:var(--accent)}.pill.rb{background:rgba(194,38,75,.12);color:var(--ruby)}
.seg{display:inline-flex;background:var(--chip);border-radius:99px;padding:3px;position:relative;flex:none}
.seg span{position:relative;z-index:1;font-size:13px;padding:6px 14px;border-radius:99px;color:var(--ink2);font-weight:600;cursor:pointer;transition:color .3s;white-space:nowrap}
.seg span.on{color:var(--ink)}
.seg>i{position:absolute;top:3px;bottom:3px;border-radius:99px;background:var(--cardE);box-shadow:0 1px 4px rgba(0,0,0,.14);transition:left .5s var(--spring),width .5s var(--spring)}
.sw{width:44px;height:26px;border-radius:99px;background:var(--track);position:relative;cursor:pointer;transition:background .3s;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:99px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:left .35s var(--spring)}
.sw.on{background:#34C759}.sw.on:after{left:21px}
.sw.lock{background:#34C759;opacity:.85}
.bar8{height:8px;border-radius:9px;background:var(--track);overflow:hidden}
.bar8 i{display:block;height:100%;border-radius:9px;width:0;transition:width 1.2s var(--out)}
.hlS{background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 0/0% 100%;transition:background-size 1.1s var(--out);border-radius:3px}
.hlS.acceso{background-size:100% 100%}
/* sfera di Ruby */
.sfera{border-radius:99px;background:radial-gradient(circle at 34% 28%,#fff 0,#ffd6e0 15%,#f2738f 42%,#c2264b 72%,#740c28 100%);box-shadow:inset 0 -4px 10px rgba(80,0,24,.35),0 4px 12px -4px rgba(170,30,70,.55);position:relative;overflow:hidden;flex:none;display:inline-block}
.sfera:after{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.45),transparent 30%,rgba(255,150,190,.4),transparent 60%,rgba(255,220,230,.45),transparent);animation:gira 6s linear infinite;mix-blend-mode:overlay}
.sfera.viva{animation:respira 4s ease-in-out infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes respira{50%{transform:scale(1.045);box-shadow:inset 0 -4px 10px rgba(80,0,24,.35),0 10px 30px -6px rgba(230,70,110,.6)}}
/* barra */
#bar{position:absolute;top:0;left:0;right:0;height:34px;display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:600;color:var(--wallInk);z-index:50}
#bar .pl{padding:5px 11px;border-radius:99px;display:flex;align-items:center;gap:7px;margin-right:6px}
#bar .clock{position:absolute;left:50%;transform:translateX(-50%);font-weight:500;font-variant-numeric:tabular-nums}
#bar .right{margin-left:auto;display:flex;gap:6px;align-items:center}
#bar .ic{width:28px;height:28px;border-radius:99px;display:grid;place-items:center;cursor:pointer;position:relative;font-size:14px}
#bNov{cursor:pointer;color:var(--ruby)}
/* dock */
#dock{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);padding:8px 10px 5px;border-radius:26px;display:flex;align-items:flex-end;gap:4px;z-index:50}
#dock .it{width:62px;text-align:center;font-size:10.5px;color:var(--wallInk);font-weight:500;cursor:pointer;position:relative;transition:width .14s}
#dock img{width:50px;height:50px;display:block;margin:0 auto 2px;transition:width .14s,height .14s;-webkit-user-drag:none;user-select:none}
#dock .dot{width:4px;height:4px;border-radius:9px;background:var(--wallInk);margin:1px auto 0;opacity:0}
#dock .it.on .dot{opacity:1}
#dock .agd{position:absolute;left:0;right:0;pointer-events:none;text-align:center;color:#222;font-family:var(--fontd)}
/* finestra */
#win{position:absolute;left:16px;top:42px;width:1408px;height:758px;border-radius:24px;background:var(--win);backdrop-filter:blur(34px) saturate(1.3);-webkit-backdrop-filter:blur(34px) saturate(1.3);border:1px solid var(--glassE);box-shadow:0 40px 80px -24px rgba(8,40,60,.45);overflow:hidden;z-index:20}
#win .tb{height:40px;display:flex;align-items:center;padding:0 18px;gap:8px;font-weight:600;font-size:14px}
.lights{display:flex;gap:8px;margin-right:12px}.lights i{width:12px;height:12px;border-radius:9px;display:block}
#side{position:absolute;left:12px;top:46px;bottom:12px;width:248px;border-radius:20px;background:var(--panel);border:1px solid var(--sep);padding:12px 10px;overflow:auto;scrollbar-width:none}
#side::-webkit-scrollbar{display:none}
.sTop{display:flex;align-items:center;gap:10px;padding:0 6px 6px}
.sTop b{font-family:var(--fontd);font-size:17px;display:block}
.sTop small{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.sTop small i{width:7px;height:7px;border-radius:9px;background:#34C759;display:block}
.nv{display:flex;align-items:center;gap:8px;padding:0 8px;height:19px;border-radius:8px;font-size:12.5px;cursor:pointer;color:var(--ink);transition:background .2s;white-space:nowrap;overflow:hidden}
.nv:hover{background:var(--chip)}
.nv.on{background:rgba(194,38,75,.13);color:var(--ruby);font-weight:600}
.nv em{font-style:normal;font-size:10.5px;color:var(--ink3);width:16px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.nv.on em{color:var(--ruby)}
.nv.home{height:26px;font-weight:600;margin-bottom:2px}
.nGt{font-size:10px;letter-spacing:.3px;text-transform:uppercase;font-weight:700;padding:6px 8px 2px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.nGt i{width:7px;height:7px;border-radius:9px;display:block}
#main{position:absolute;left:272px;right:14px;top:46px;bottom:12px}
#hdr{position:absolute;left:4px;right:0;top:0;height:92px;display:flex;align-items:flex-start;gap:20px}
#hdr .eb{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:7px}
#hdr .eb i{width:8px;height:8px;border-radius:9px;display:block}
#hdr h1{font-family:var(--fontd);font-size:27px;font-weight:700;letter-spacing:-.7px;margin-top:3px;line-height:1.1}
#hdr p{font-size:13.5px;color:var(--ink2);margin-top:5px;line-height:1.4;text-wrap:pretty}
#hdr .ctr{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none;padding-top:4px}
.arr{width:32px;height:32px;border-radius:99px;display:grid;place-items:center;background:var(--cardE);border:1px solid var(--sep);cursor:pointer;font-size:16px;transition:transform .25s var(--spring)}
.arr:active{transform:scale(.9)}
#hN{font-size:12.5px;color:var(--ink2);font-weight:600;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
#sc{position:absolute;left:0;right:0;top:100px;bottom:0}
/* chat */
.chat{overflow:auto;scrollbar-width:thin;padding:4px 6px 10px 2px;display:flex;flex-direction:column}
.msg{max-width:620px;margin-bottom:12px;font-size:14px;line-height:1.5}
.msg.me{margin-left:auto;background:var(--accent);color:#fff;padding:9px 15px;border-radius:20px 20px 6px 20px;width:fit-content}
.msg.ruby{background:var(--chip);padding:12px 16px;border-radius:20px 20px 20px 6px;width:fit-content;max-width:680px}
.msg.ruby .who{font-size:11.5px;color:var(--ruby);font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.typing{display:inline-flex;gap:4px;padding:4px 0}.typing i{width:7px;height:7px;border-radius:9px;background:var(--ink3);animation:tp 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{30%{transform:translateY(-5px);opacity:1}0%,60%,100%{opacity:.4}}
.sugg{border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:500;background:var(--cardE);border:1px solid var(--sep);cursor:pointer;white-space:nowrap;transition:transform .25s var(--spring)}
.sugg:hover{transform:translateY(-2px)}
.inBox{display:flex;align-items:center;gap:10px;border-radius:99px;background:var(--cardE);border:1px solid var(--sep);padding:7px 8px 7px 16px;font-size:13.5px;color:var(--ink3)}
.inBox .send{margin-left:auto;width:30px;height:30px;border-radius:99px;background:var(--ruby);color:#fff;display:grid;place-items:center;font-size:14px}
/* scheda azioni */
.az{margin-top:10px;border-radius:16px;background:var(--cardE);border:1px solid var(--sep);padding:12px 14px;box-shadow:0 10px 22px -16px rgba(0,0,0,.35)}
.azH{font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;color:var(--ink2);margin-bottom:6px}
.azR{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--sep)}
.azR:last-of-type{border-bottom:0}
.azT{flex:1;min-width:0}.azT b{font-size:13.5px;display:block}.azT small{font-size:12.5px;color:var(--ink2);display:block;line-height:1.4;margin-top:1px}
.azOk{width:22px;height:22px;border-radius:99px;border:2px solid var(--track);flex:none;display:grid;place-items:center;transition:all .35s var(--spring)}
.azR.fatto .azOk{background:var(--green);border-color:var(--green);transform:scale(1.1)}
.azR.fatto .azOk:after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink2);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--sep)}
.tbl td{padding:8px;border-bottom:1px solid var(--sep);vertical-align:middle;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
/* passi */
.prep{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--sep);opacity:.4;transition:opacity .4s}
.prep.vivo,.prep.ok{opacity:1}
.prep .dot{width:22px;height:22px;border-radius:99px;border:2px solid var(--track);display:grid;place-items:center;transition:all .35s var(--spring);flex:none;margin-top:1px}
.prep.vivo .dot{border-color:var(--ruby);border-top-color:transparent;animation:gira .8s linear infinite}
.prep.ok .dot{background:var(--green);border-color:var(--green);transform:scale(1.06);animation:none}
.prep.ok .dot:after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.prep b{font-size:13.5px;display:block}.prep small{font-size:12.5px;color:var(--ink2);display:block;margin-top:2px}
/* carta */
.paper{background:#fff;color:#14202B;box-shadow:0 20px 50px -14px rgba(0,0,0,.28);padding:30px 34px;position:relative;font-family:Inter,var(--font);border-radius:4px}
.paper .pl{font-size:10.5px;letter-spacing:1.3px;color:#2563EB;font-weight:700;text-transform:uppercase}
.paper h3{font-family:var(--fontd);font-size:24px;font-weight:700;letter-spacing:-.6px;line-height:1.15;margin-top:5px;text-wrap:balance}
.paper .tx{font-size:13px;line-height:1.65;color:#33424D;margin-top:10px}
.paper .sec{font-size:11px;font-weight:700;margin-top:16px;letter-spacing:.5px;text-transform:uppercase;color:#14202B}
.paper .foot{position:absolute;left:34px;right:34px;bottom:18px;font-size:9.5px;color:#7A8790;line-height:1.4;border-top:1px solid #E3E8EC;padding-top:7px}
.mk{border-radius:4px;padding:0 3px;transition:background .5s,color .5s,box-shadow .5s;position:relative}
.mk.r{background:rgba(229,72,77,.15);box-shadow:inset 0 -2px 0 #E5484D}
.mk.o{background:rgba(224,138,0,.16);box-shadow:inset 0 -2px 0 #E08A00}
.mk.g{background:rgba(47,163,90,.15);box-shadow:inset 0 -2px 0 #2FA35A}
.mk sup{font-size:9px;font-weight:800;border-radius:99px;color:#fff;padding:1px 5px;margin-left:3px;vertical-align:4px}
.mk.r sup{background:#E5484D}.mk.o sup{background:#E08A00}.mk.g sup{background:#2FA35A}
.sev{display:flex;gap:12px;padding:11px 14px;border-radius:14px;background:var(--cardE);border:1px solid var(--sep);position:relative;overflow:hidden;transition:opacity .4s,transform .4s var(--out)}
.sev:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.sev.r:before{background:var(--red)}.sev.o:before{background:var(--orange)}.sev.g:before{background:var(--green)}.sev.n:before{background:var(--ink3)}
.sev.fatto{opacity:.55}.sev.fatto .sevT b{text-decoration:line-through}
.sevT{flex:1;min-width:0}.sevT b{font-size:13.5px;display:block}.sevT small{font-size:12.5px;color:var(--ink2);display:block;margin-top:2px;line-height:1.4}
/* pannello novità */
#novP{position:absolute;left:calc(50% - 600px);top:42px;width:1200px;border-radius:24px;padding:18px 20px 20px;z-index:62;display:none}
#novP .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:12px}
.novI{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:12px;cursor:pointer;color:var(--ink);transition:background .2s;font-size:13px;font-weight:600}
.novI:hover{background:var(--chip)}
.novN{width:22px;height:22px;border-radius:99px;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
#toast{position:absolute;left:50%;top:44px;transform:translateX(-50%) translateY(-20px);opacity:0;transition:all .45s var(--spring);background:rgba(15,36,51,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:99px;z-index:95;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* scene particolari */
.wk{position:relative;display:grid;grid-template-columns:44px repeat(5,1fr);height:100%}
.wkH{font-size:12px;font-weight:600;text-align:center;padding:6px 0;color:var(--ink2)}
.wkH.oggi{color:var(--red)}
.ev{position:absolute;border-radius:10px;padding:5px 8px;overflow:hidden;border-left:3px solid;font-size:12px;line-height:1.3;transition:left .9s var(--spring),top .9s var(--spring),opacity .4s}
.ev b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev small{color:var(--ink2);font-size:11px}
.ev.prop{border:2px dashed var(--ruby);background:rgba(194,38,75,.07);cursor:pointer;animation:pulsa 1.8s ease-in-out infinite}
@keyframes pulsa{50%{box-shadow:0 0 0 6px rgba(194,38,75,.14)}}
.doc{width:96px;height:124px;border-radius:6px;background:#fff;box-shadow:0 10px 24px -10px rgba(0,0,0,.4);padding:10px 9px;position:absolute;color:#14202B}
.doc i{display:block;height:4px;border-radius:3px;background:#E3E8EC;margin:5px 0}
.doc .dh{height:16px;border-radius:3px;margin-bottom:8px}

let base=new Float32Array(GH*3);function coloriAcqua(){const d=document.body.classList.contains('dark');for(let y=0;y<GH;y++){const t=y/GH;if(d){base[y*3]=14+6*t;base[y*3+1]=30+8*t;base[y*3+2]=42+10*t;}else{base[y*3]=228-34*t;base[y*3+1]=239-22*t;base[y*3+2]=245-14*t;}}}
function goccia(px,py,f,r){const cx=px/G|0,cy=py/G|0;r=r||2;for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){const d=x*x+y*y;if(d>r*r)continue;const i=(cy+y)*GW+cx+x;if(i>0&&i<ha.length)ha[i]-=f*(1-d/(r*r+1));}}
function passoA(){for(let y=1;y<GH-1;y++){const r=y*GW;for(let x=1;x<GW-1;x++){const i=r+x;hb[i]=((ha[i-1]+ha[i+1]+ha[i-GW]+ha[i+GW])*.5-hb[i])*.986;}}const t=ha;ha=hb;hb=t;}
function acqua(){const d=img.data,dark=document.body.classList.contains('dark'),k1=dark?1.6:2.4;for(let y=1;y<GH-1;y++){const r=y*GW,yy=y*3;for(let x=1;x<GW-1;x++){const i=r+x;const l=((ha[i+1]-ha[i-1])*.8-(ha[i+GW]-ha[i-GW])*1.2)*k1;const sp=l>6?(l-6)*2:0;const q=i*4;d[q]=base[yy]+l+sp;d[q+1]=base[yy+1]+l+sp;d[q+2]=base[yy+2]+l*.8+sp;d[q+3]=255;}}
 octx.putImageData(img,0,0);wctx.imageSmoothingEnabled=true;wctx.imageSmoothingQuality='high';wctx.drawImage(off,1,1,GW-2,GH-2,0,0,WW,WH);}
let pioggia=0,acc=0,lastT=performance.now();
function ciclo(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;pioggia-=dt;if(pioggia<=0){goccia(Math.random()*WW,Math.random()*WH,ridotto?3:9,1);pioggia=(ridotto?2.5:.7)+Math.random()*1.1;}
 acc+=dt;let n=0;while(acc>1/50&&n<2){passoA();acc-=1/50;n++;}acqua();requestAnimationFrame(ciclo);}

function tema(dark){document.body.classList.toggle('dark',dark);$$('.logoF').forEach(g=>g.setAttribute('fill',dark?'#fff':'#0F2433'));coloriAcqua();}
const root=document.documentElement;let mq=null;try{mq=matchMedia('(prefers-color-scheme: dark)')}catch(e){}
const temaIniziale=()=>{const dt=root.getAttribute('data-theme');return dt==='dark'?true:dt==='light'?false:!!(mq&&mq.matches);};
tema(temaIniziale());
try{mq&&mq.addEventListener('change',()=>{if(!root.getAttribute('data-theme'))tema(temaIniziale())})}catch(e){}
try{new MutationObserver(()=>tema(temaIniziale())).observe(root,{attributes:true,attributeFilter:['data-theme']})}catch(e){}
$('#bTema').addEventListener('click',()=>tema(!document.body.classList.contains('dark')));
for(let i=0;i<40;i++)goccia(Math.random()*WW,Math.random()*WH,8,1);for(let i=0;i<30;i++)passoA();acqua();requestAnimationFrame(ciclo);
stage.addEventListener('pointerdown',e=>{if(e.target===wall){const r=stage.getBoundingClientRect();goccia((e.clientX-r.left)/S,(e.clientY-r.top)/S,ridotto?10:32,3);}});

ora();setInterval(ora,15000);
